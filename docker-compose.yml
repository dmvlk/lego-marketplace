name: lego-marketplace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lego}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lego_password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lego} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  deals-service:
    build:
      context: ./backend/deals-service
    environment:
      DATABASE_URL: postgresql+asyncpg://lego:lego_password@postgres:5432/deals_db
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      CATALOG_SERVICE_URL: http://catalog-service:8002
      SERVICE_TOKEN: ${SERVICE_TOKEN:-replace-with-a-long-random-service-token}
      PAYMENT_SERVICE_URL: http://payment-service:8004
      INSPECTION_PERIOD_HOURS: ${INSPECTION_PERIOD_HOURS:-48}
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  delivery-service:
    build:
      context: ./backend/delivery-service
    environment:
      DATABASE_URL: postgresql+asyncpg://lego:lego_password@postgres:5432/delivery_db
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      DEALS_SERVICE_URL: http://deals-service:8003
      SERVICE_TOKEN: ${SERVICE_TOKEN:-replace-with-a-long-random-service-token}
    depends_on:
      postgres:
        condition: service_healthy
      deals-service:
        condition: service_healthy
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  payment-service:
    build:
      context: ./backend/payment-service
    environment:
      DATABASE_URL: postgresql+asyncpg://lego:lego_password@postgres:5432/payment_db
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      DEALS_SERVICE_URL: http://deals-service:8003
      SERVICE_TOKEN: ${SERVICE_TOKEN:-replace-with-a-long-random-service-token}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-replace-with-a-long-random-payment-webhook-secret}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-5}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-RUB}
    depends_on:
      postgres:
        condition: service_healthy
      deals-service:
        condition: service_healthy
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-lego}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-lego_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-lego_password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-lego_password} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - minio_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: ./backend/gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      AUTH_SERVICE_URL: http://auth-service:8001
      CATALOG_SERVICE_URL: http://catalog-service:8002
      DEALS_SERVICE_URL: http://deals-service:8003
      PAYMENT_SERVICE_URL: http://payment-service:8004
      DELIVERY_SERVICE_URL: http://delivery-service:8005
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      deals-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: ./backend/auth-service
    environment:
      DATABASE_URL: postgresql+asyncpg://lego:lego_password@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-30}
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  catalog-service:
    build:
      context: ./backend/catalog-service
    environment:
      DATABASE_URL: postgresql+asyncpg://lego:lego_password@postgres:5432/catalog_db
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      S3_ENDPOINT_URL: http://minio:4566
      S3_BUCKET: lego-marketplace-images
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      SERVICE_TOKEN: ${SERVICE_TOKEN:-replace-with-a-long-random-service-token}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
